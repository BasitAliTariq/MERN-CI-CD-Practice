name: Build and Deploy MERN App

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./client
          file: ./client/Dockerfile
          push: true
          build-args: |
            VITE_BACKEND_URL=
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/mern-frontend:${{ github.sha }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./server
          file: ./server/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/mern-backend:${{ github.sha }}

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -eu

            cd /home/ubuntu/app/MERN-CI-CD-Practice

            # Update deployment files from the same commit.
            git fetch origin main
            git checkout main
            git reset --hard ${{ github.sha }}

            # Update only IMAGE_TAG in the existing .env.
            # Preserve all other manually configured variables.
            if grep -q '^IMAGE_TAG=' .env; then
              sed -i 's/^IMAGE_TAG=.*/IMAGE_TAG=${{ github.sha }}/' .env
            else
              printf '\nIMAGE_TAG=${{ github.sha }}\n' >> .env
            fi

            # Authenticate with Docker Hub.
            echo '${{ secrets.DOCKERHUB_TOKEN }}' | \
              docker login -u '${{ secrets.DOCKERHUB_USERNAME }}' --password-stdin

            # Deploy the new images.
            docker compose pull
            docker compose up -d --remove-orphans
            docker compose ps

            # Remove Docker credentials from the EC2 user's CLI config.
            docker logout
